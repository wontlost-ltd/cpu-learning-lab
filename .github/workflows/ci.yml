name: Native CPU checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # Action runtimes are declared upstream; shell commands follow the latest Node LTS.
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          check-latest: true
          package-manager-cache: false
      - run: node --version
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release
      - run: ctest --test-dir build -C Release --output-on-failure

  microphone-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y portaudio19-dev
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCPUAI_WITH_PORTAUDIO=ON
      - run: cmake --build build --config Release
      # Compiles/links the real adapter; tests use deterministic PCM, not a hosted microphone.
      - run: ctest --test-dir build -C Release --output-on-failure
      - run: ./build/cpu-listen --capabilities

  network-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - if: runner.os == 'macOS'
        run: |
          brew list openssl@3 || brew install openssl@3
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCPUAI_WITH_NETWORK=ON
      - run: cmake --build build --config Release
      - run: ctest --test-dir build -C Release --output-on-failure
